<!doctype html>
<html lang="en" data-theme="abyss">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1e28" />
    <link id="favicon-tag" rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <link id="apple-favicon-tag" rel="apple-touch-icon" href="/favicon-dark.svg" />
    <title>Mohammed Daiyan Portfolio</title>
    <meta name="description" content="Mohammed Daiyan — Computer Science &amp; Engineering student at NIE Mysore. Full-stack developer building robust backend services with Java &amp; Spring Boot, modern React frontends, and intelligent systems." />

    <meta name="author" content="Mohammed Daiyan" />

    <!-- Immediate theme setter (default to dark theme abyss & dynamic favicon) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('daiyan-theme');
          var isLight = (t === 'caramellatte');
          document.documentElement.dataset.theme = isLight ? 'caramellatte' : 'abyss';
          var fav = document.getElementById('favicon-tag');
          if (fav) fav.href = isLight ? '/favicon-light.svg' : '/favicon-dark.svg';
          var apple = document.getElementById('apple-favicon-tag');
          if (apple) apple.href = isLight ? '/favicon-light.svg' : '/favicon-dark.svg';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = isLight ? '#faf5ed' : '#0c1e28';
        } catch (e) {
          document.documentElement.dataset.theme = 'abyss';
        }
      })();
    </script>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohammed Daiyan Portfolio" />
