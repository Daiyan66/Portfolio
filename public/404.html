<!DOCTYPE html>
<html lang="en" data-theme="abyss">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Page Not Found — Mohammed Daiyan Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <meta name="theme-color" content="#0c1e28" />
    <script type="text/javascript">
      // SPA redirect for GitHub Pages and static web servers:
      // Transfers the requested path to ?p=... so the React app immediately displays the custom 404 UI.
      (function() {
        var l = window.location;
        var path = l.pathname;
        if (path && path !== '/' && path !== '/404.html') {
          var redirectUrl = l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(path + l.search + l.hash);
          l.replace(redirectUrl);
        }
      })();
    </script>
    <style>
      :root {
        --bg: #0c1e28;
        --card: #08151c;
        --text: #e2f1e8;
        --muted: #8ea39c;
        --accent: #10b981;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 600px;
        background: var(--card);
        padding: 48px 32px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 72px;
        margin: 0 0 16px;
        color: var(--accent);
        letter-spacing: -2px;
      }
      h2 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 28px;
      }
      a {
        display: inline-block;
        background-color: var(--accent);
        color: #061016;
        padding: 12px 28px;
        border-radius: 9999px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s ease;
      }
      a:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Submerged Beyond Reach</h2>
      <p>The endpoint you requested does not exist or has drifted away. Returning you to the portfolio...</p>
      <a href="/">Return to Mohammed Daiyan Portfolio</a>
    </div>
  </body>
</html>
