    <!-- Immediate theme setter (default to dark theme abyss & dynamic favicon) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('daiyan-theme');
          var isLight = (t === 'caramellatte');
          document.documentElement.dataset.theme = isLight ? 'caramellatte' : 'abyss';
          var fav = document.getElementById('favicon-tag');
          if (fav) fav.href = isLight ? '/favicon-light.svg' : '/favicon-dark.svg';
          var apple = document.getElementById('apple-favicon-tag');
          if (apple) apple.href = isLight ? '/favicon-light.svg' : '/favicon-dark.svg';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = isLight ? '#faf5ed' : '#0c1e28';
        } catch (e) {
          document.documentElement.dataset.theme = 'abyss';
        }
      })();
    </script>
